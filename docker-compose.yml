services:
  mysql:
    image: mysql:8.4
    container_name: ikt453_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ikt453_mysql_data:/var/lib/mysql
      - ./sql/mysql/001_star_schema.sql:/docker-entrypoint-initdb.d/001_star_schema.sql:ro
      - ./sql/mysql/002_summary_tables.sql:/docker-entrypoint-initdb.d/002_summary_tables.sql:ro

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: ikt453_phpmyadmin
    restart: always
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME}
      PMA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:80"

  mongodb:
    image: mongo:7
    container_name: ikt453_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${DB_NAME}
      MONGO_INITDB_ROOT_USERNAME: ${DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - ikt453_mongodb_data:/data/db
      - ./sql/mongodb/001_document_model.js:/docker-entrypoint-initdb.d/001_document_model.js:ro
      - ./sql/mongodb/002_indexes.js:/docker-entrypoint-initdb.d/002_indexes.js:ro


  mongo-express:
    image: mongo-express:1.0.2
    container_name: ikt453_mongo_express
    restart: always
    depends_on:
      - mongodb
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${DB_USERNAME}:${DB_PASSWORD}@mongodb:27017/admin?authSource=admin
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${DB_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${DB_PASSWORD}
      ME_CONFIG_BASICAUTH_USERNAME: ${DB_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${DB_PASSWORD}
      ME_CONFIG_MONGODB_SERVER: mongodb
    ports:
      - "8081:8081"

  neo4j:
    image: neo4j:5.26
    container_name: ikt453_neo4j
    restart: always
    entrypoint: ["/init/init-neo4j.sh"]
    environment:
      NEO4J_AUTH: neo4j/${DB_PASSWORD}
      NEO4J_PASSWORD: ${DB_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ikt453_neo4j_data:/data
      - ikt453_neo4j_logs:/logs
      - ikt453_neo4j_config:/config
      - ikt453_neo4j_plugins:/plugins
      - ./sql/neo4j/init-neo4j.sh:/init/init-neo4j.sh:ro
      - ./sql/neo4j/001_constraints.cypher:/docker-entrypoint-initdb.d/001_constraints.cypher:ro

  zookeeper:
    image: confluentinc/cp-zookeeper:6.0.1
    platform: linux/amd64
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  broker:
    image: confluentinc/cp-enterprise-kafka:6.0.1
    platform: linux/amd64
    hostname: broker
    container_name: broker
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENERS: PLAINTEXT://broker:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

volumes:
  ikt453_mysql_data:
  ikt453_mongodb_data:
  ikt453_neo4j_data:
  ikt453_neo4j_logs:
  ikt453_neo4j_config:
  ikt453_neo4j_plugins: