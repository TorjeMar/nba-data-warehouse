<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Basketball Data Warehouse{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #222;
            min-height: 100vh;
        }
        nav {
            background: #fff;
            padding: 0.9rem 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
            border-bottom: 1px solid #ddd;
        }
        nav a {
            color: #555;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
        }
        nav a:hover { color: #111; }
        nav .brand {
            font-size: 1rem;
            font-weight: 700;
            color: #111;
            letter-spacing: -0.02em;
        }
        .container {
            max-width: 860px;
            margin: 0 auto;
            padding: 2.5rem 2rem;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            color: #111;
        }
        h2 {
            font-size: 0.95rem;
            font-weight: 400;
            margin-bottom: 1.5rem;
            color: #777;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
        }
        .card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 1.5rem;
            text-decoration: none;
            color: #222;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .card:hover {
            border-color: #999;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .card h3 {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }
        .card p {
            color: #888;
            font-size: 0.85rem;
            line-height: 1.4;
        }
        .breadcrumb {
            margin-bottom: 1.2rem;
            color: #999;
            font-size: 0.85rem;
        }
        .breadcrumb a { color: #555; text-decoration: none; }
        .breadcrumb a:hover { color: #111; }
        .breadcrumb span { margin: 0 0.3rem; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 0.6rem 1rem;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 0.9rem;
        }
        th {
            background: #fafafa;
            font-weight: 600;
            color: #444;
            border-bottom: 1px solid #ddd;
        }
        .placeholder {
            background: #fff;
            border: 1px dashed #ccc;
            border-radius: 8px;
            padding: 2.5rem;
            text-align: center;
            color: #999;
            font-size: 0.9rem;
        }
        .placeholder code {
            display: block;
            margin-top: 0.4rem;
            color: #555;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <nav>
        <span class="brand">Basketball DW</span>
        <a href="/">Home</a>
        {% if db %}
        <a href="/{{ db }}">{{ db | upper }}</a>
        {% endif %}
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
