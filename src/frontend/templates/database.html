{% extends "base.html" %}

{% block title %}{{ db | upper }} - Basketball DW{% endblock %}

{% block content %}
<div class="breadcrumb">
    <a href="/">Home</a><span>/</span>{{ db | upper }}
</div>

<h1>{{ db | upper }}</h1>
<h2>Choose a query category</h2>

<div class="cards">
    <a class="card" href="/{{ db }}/team">
        <h3>By Team</h3>
        <p>View team statistics and performance data</p>
    </a>

    <a class="card" href="/{{ db }}/year">
        <h3>By Year</h3>
        <p>View season-level statistics and trends</p>
    </a>
</div>
{% endblock %}
